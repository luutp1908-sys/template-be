name: Deploy Backend Prod

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TF_DIR: infra/environments/prod
  ECR_REPOSITORY: be-monolith
  ECS_CLUSTER: template-saas-prod-cluster
  ECS_SERVICE: template-saas-prod-monolith

jobs:
  deploy:
    name: Build Push and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE_TAG="${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

          echo "Image tag: ${IMAGE_TAG}"
          echo "Image URI: ${IMAGE_URI}"

      - name: Build and push image (ARM64)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance false \
            -t "$IMAGE_URI" \
            --push \
            .

      - name: Migration gate
        run: |
          SERVICE_JSON="$(aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --output json)"

          CURRENT_TASK_DEFINITION="$(echo "$SERVICE_JSON" | jq -r '.services[0].taskDefinition')"
          SUBNETS="$(echo "$SERVICE_JSON" | jq -r '.services[0].networkConfiguration.awsvpcConfiguration.subnets | join(",")')"
          SECURITY_GROUPS="$(echo "$SERVICE_JSON" | jq -r '.services[0].networkConfiguration.awsvpcConfiguration.securityGroups | join(",")')"
          ASSIGN_PUBLIC_IP="$(echo "$SERVICE_JSON" | jq -r '.services[0].networkConfiguration.awsvpcConfiguration.assignPublicIp')"

          if [ -z "$CURRENT_TASK_DEFINITION" ] || [ "$CURRENT_TASK_DEFINITION" = "null" ]; then
            echo "Migration gate failed: unable to determine current task definition."
            exit 1
          fi

          TASK_DEFINITION_JSON="$(aws ecs describe-task-definition \
            --region "$AWS_REGION" \
            --task-definition "$CURRENT_TASK_DEFINITION" \
            --output json)"

          TASK_FAMILY="$(echo "$TASK_DEFINITION_JSON" | jq -r '.taskDefinition.family')"
          MIGRATION_FAMILY="migration-${TASK_FAMILY}"

          echo "$TASK_DEFINITION_JSON" | jq \
            --arg family "$MIGRATION_FAMILY" \
            --arg image "$IMAGE_URI" \
            '.taskDefinition
            | {
                family: $family,
                taskRoleArn,
                executionRoleArn,
                networkMode,
                containerDefinitions: (
                  .containerDefinitions
                  | map(
                      if .name == "be-monolith" then
                        .image = $image
                        | .command = ["node", "node_modules/prisma/build/index.js", "migrate", "deploy", "--schema=prisma/schema.prisma"]
                      else
                        .
                      end
                    )
                ),
                volumes,
                placementConstraints,
                requiresCompatibilities,
                cpu,
                memory,
                runtimePlatform,
                ephemeralStorage,
                pidMode,
                ipcMode,
                proxyConfiguration
              }
            | with_entries(select(.value != null and .value != []))' > migration-task-def.json

          MIGRATION_TASK_DEFINITION="$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json file://migration-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          cleanup() {
            if [ -n "${MIGRATION_TASK_DEFINITION:-}" ] && [ "$MIGRATION_TASK_DEFINITION" != "None" ]; then
              aws ecs deregister-task-definition \
                --region "$AWS_REGION" \
                --task-definition "$MIGRATION_TASK_DEFINITION" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          echo "Registered migration task definition: $MIGRATION_TASK_DEFINITION"

          RUN_TASK_OUTPUT="$(aws ecs run-task \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$MIGRATION_TASK_DEFINITION" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=$ASSIGN_PUBLIC_IP}" \
            --query '{taskArn:tasks[0].taskArn, failures:failures}' \
            --output json)"

          MIGRATION_TASK_ARN="$(echo "$RUN_TASK_OUTPUT" | jq -r '.taskArn')"
          RUN_FAILURES="$(echo "$RUN_TASK_OUTPUT" | jq -c '.failures')"

          if [ -z "$MIGRATION_TASK_ARN" ] || [ "$MIGRATION_TASK_ARN" = "null" ]; then
            echo "Migration gate failed: could not start migration task."
            echo "$RUN_FAILURES"
            exit 1
          fi

          echo "Started migration task: $MIGRATION_TASK_ARN"
          aws ecs wait tasks-stopped \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --tasks "$MIGRATION_TASK_ARN"

          TASK_DETAILS="$(aws ecs describe-tasks \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --tasks "$MIGRATION_TASK_ARN" \
            --output json)"

          MIGRATION_EXIT_CODE="$(echo "$TASK_DETAILS" | jq -r '.tasks[0].containers[] | select(.name == "be-monolith") | .exitCode // empty')"
          MIGRATION_STOPPED_REASON="$(echo "$TASK_DETAILS" | jq -r '.tasks[0].stoppedReason // ""')"
          MIGRATION_TASK_ID="${MIGRATION_TASK_ARN##*/}"
          MIGRATION_LOG_GROUP="$(echo "$TASK_DEFINITION_JSON" | jq -r '.taskDefinition.containerDefinitions[] | select(.name == "be-monolith") | .logConfiguration.options["awslogs-group"]')"
          MIGRATION_LOG_STREAM="ecs/be-monolith/${MIGRATION_TASK_ID}"

          if [ -n "$MIGRATION_LOG_GROUP" ] && [ "$MIGRATION_LOG_GROUP" != "null" ]; then
            aws logs get-log-events \
              --region "$AWS_REGION" \
              --log-group-name "$MIGRATION_LOG_GROUP" \
              --log-stream-name "$MIGRATION_LOG_STREAM" \
              --limit 200 \
              --query 'events[*].message' \
              --output text || true
          fi

          if [ -z "$MIGRATION_EXIT_CODE" ] || [ "$MIGRATION_EXIT_CODE" != "0" ]; then
            echo "Migration gate failed: migration task exited unsuccessfully."
            echo "Stopped reason: $MIGRATION_STOPPED_REASON"
            echo "$TASK_DETAILS" | jq '.tasks[0]'
            exit 1
          fi

          echo "Migration gate passed."

      - name: Terraform init
        run: terraform -chdir="$TF_DIR" init -input=false

      - name: Terraform fmt check
        run: terraform -chdir="$TF_DIR" fmt -check

      - name: Terraform validate
        run: terraform -chdir="$TF_DIR" validate

      - name: Terraform plan
        run: |
          terraform -chdir="$TF_DIR" plan \
            -input=false \
            -var-file=terraform.tfvars \
            -var="monolith_image_tag=$IMAGE_TAG" \
            -out=tfplan

      - name: Terraform apply
        run: terraform -chdir="$TF_DIR" apply -input=false -auto-approve tfplan

      - name: Wait for ECS service to stabilize
        run: |
          aws ecs wait services-stable \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,taskDef:taskDefinition,status:status}'

      - name: Health check
        run: |
          ALB_DNS="$(terraform -chdir="$TF_DIR" output -raw alb_dns_name)"
          HEALTH_URL="http://${ALB_DNS}/api/v1/health"

          HTTP_CODE="$(curl -sS -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL")"
          cat /tmp/health.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed: $HEALTH_URL returned HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Health check passed: $HEALTH_URL"

      - name: Smoke checks for critical public routes
        run: |
          ALB_DNS="$(terraform -chdir="$TF_DIR" output -raw alb_dns_name)"
          HEALTH_URL="http://${ALB_DNS}/api/v1/health"
          DOCS_URL="http://${ALB_DNS}/docs"

          HEALTH_CODE="$(curl -sS -o /tmp/health-smoke.json -w "%{http_code}" "$HEALTH_URL")"
          DOCS_CODE="$(curl -sS -o /tmp/docs-smoke.html -w "%{http_code}" "$DOCS_URL")"

          cat /tmp/health-smoke.json
          echo "Docs status code: $DOCS_CODE"

          if [ "$HEALTH_CODE" != "200" ]; then
            echo "Smoke check failed: $HEALTH_URL returned HTTP $HEALTH_CODE"
            exit 1
          fi

          if [ "$DOCS_CODE" != "200" ]; then
            echo "Smoke check failed: $DOCS_URL returned HTTP $DOCS_CODE"
            exit 1
          fi

          echo "Smoke checks passed for health and docs endpoints."

      - name: Rollback to previous ECS task definition
        if: ${{ failure() }}
        run: |
          CURRENT_TASK_DEFINITION="$(aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"

          if [ -z "$CURRENT_TASK_DEFINITION" ] || [ "$CURRENT_TASK_DEFINITION" = "None" ]; then
            echo "Unable to determine current ECS task definition."
            exit 1
          fi

          TASK_FAMILY="$(aws ecs describe-task-definition \
            --region "$AWS_REGION" \
            --task-definition "$CURRENT_TASK_DEFINITION" \
            --query 'taskDefinition.family' \
            --output text)"

          PREVIOUS_REVISION="$(aws ecs list-task-definitions \
            --region "$AWS_REGION" \
            --family-prefix "$TASK_FAMILY" \
            --status ACTIVE \
            --sort DESC \
            --query 'taskDefinitionArns' \
            --output text | tr '\t' '\n' | grep -Fxv "$CURRENT_TASK_DEFINITION" | head -n 1)"

          if [ -z "$PREVIOUS_REVISION" ] || [ "$PREVIOUS_REVISION" = "None" ]; then
            echo "No previous ACTIVE ECS task definition found to rollback to."
            exit 0
          fi

          echo "Current task definition: $CURRENT_TASK_DEFINITION"
          echo "Rolling back ECS service to previous ACTIVE revision: $PREVIOUS_REVISION"
          aws ecs update-service \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$PREVIOUS_REVISION" \
            --force-new-deployment

          aws ecs wait services-stable \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "Rollback completed successfully."

      - name: Deployment summary
        run: |
          ALB_DNS="$(terraform -chdir="$TF_DIR" output -raw alb_dns_name)"
          if [ "$GITHUB_RUN_ATTEMPT" -gt 0 ] && [ "${{ job.status }}" = "success" ]; then
            echo "## Deployment Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- Image: $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
            echo "- Cluster: $ECS_CLUSTER" >> "$GITHUB_STEP_SUMMARY"
            echo "- Service: $ECS_SERVICE" >> "$GITHUB_STEP_SUMMARY"
            echo "- Health: http://${ALB_DNS}/api/v1/health" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Deployment Failed or Rolled Back" >> "$GITHUB_STEP_SUMMARY"
            echo "- Image: $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
            echo "- Cluster: $ECS_CLUSTER" >> "$GITHUB_STEP_SUMMARY"
            echo "- Service: $ECS_SERVICE" >> "$GITHUB_STEP_SUMMARY"
          fi
